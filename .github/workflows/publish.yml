name: Publish to PyPI

# Publishes on a version tag (e.g. v0.2.2) or manual dispatch.
#
# Auth uses PyPI Trusted Publishing (OIDC) — no API token stored in GitHub.
#
# One-time setup on PyPI (https://pypi.org/manage/account/publishing/ →
# "Add a new pending publisher"). These values are the exact OIDC claims this
# workflow sends, confirmed from a real run:
#   PyPI Project Name: ai-quota-tracker
#   Owner:             SakethKanchi
#   Repository name:   tracker
#   Workflow name:     publish.yml
#   Environment name:  pypi
#
# Until that publisher exists, the publish job fails with `invalid-publisher`
# ("valid token, but no corresponding publisher"). That is the expected state
# before setup — the build job above it still validates the release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Verify the built wheel installs and runs
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/tracker --version
          /tmp/v/bin/tracker --help

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Only a version tag publishes. A manual run is a dry run: it builds and
    # verifies, but never uploads (PyPI versions are immutable — a bad upload
    # burns the version permanently).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted publishing (OIDC) — no password/token needed here.
      # If you would rather use an API token, see CONTRIBUTING.md.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
