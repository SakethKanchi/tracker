[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracker"
version = "0.1.0"
description = "Unified usage tracker for Claude + Grok accounts"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
tracker = "tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]