[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-quota-tracker"
version = "0.3.0"
description = "See every AI subscription's remaining quota in one terminal command (Claude, Grok, Codex, Gemini, OpenAI, Z.ai)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Saketh Kanchi", email = "sakethkanchi3@gmail.com" },
]
keywords = [
    "claude",
    "grok",
    "codex",
    "gemini",
    "openai",
    "zai",
    "glm",
    "zhipu",
    "anthropic",
    "xai",
    "usage",
    "quota",
    "cli",
    "tracker",
    "oauth",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/SakethKanchi/tracker"
Repository = "https://github.com/SakethKanchi/tracker"
Issues = "https://github.com/SakethKanchi/tracker/issues"
Documentation = "https://github.com/SakethKanchi/tracker#readme"
Changelog = "https://github.com/SakethKanchi/tracker/blob/main/CHANGELOG.md"

[project.scripts]
tracker = "tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
