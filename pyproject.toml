[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-usage-tracker"
version = "0.2.0"
description = "Unified local usage tracker for Claude, Grok, Codex, Gemini, and OpenAI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "sakethkanchi" },
]
keywords = [
    "claude",
    "grok",
    "codex",
    "gemini",
    "openai",
    "anthropic",
    "xai",
    "usage",
    "quota",
    "cli",
    "tracker",
    "oauth",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/sakethkanchi/tracker"
Repository = "https://github.com/sakethkanchi/tracker"
Issues = "https://github.com/sakethkanchi/tracker/issues"
Documentation = "https://github.com/sakethkanchi/tracker#readme"

[project.scripts]
tracker = "tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tracker"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]
